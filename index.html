<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSCR Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Debt Service Coverage Ratio Calculator</h1>
  <form id="calcForm">
    <label>Gross rental/operating income:
      <input type="number" id="gross" required>
    </label>
    <label>Operating expenses (excluding debt service):
      <input type="number" id="expenses" required>
    </label>
    <label>Loan amount:
      <input type="number" id="loan" required>
    </label>
    <label>Annual interest rate (%):
      <input type="number" id="interest" required>
    </label>
    <label>Loan term (years):
      <input type="number" id="term" required>
    </label>
    <label>Payment frequency:
      <select id="frequency">
        <option value="monthly">Monthly</option>
        <option value="annual">Annual</option>
      </select>
    </label>
    <button type="button" id="calcBtn">Calculate</button>
  </form>
  <div id="results"></div>
  <script src="script.js"></script>
</body>
</html>
