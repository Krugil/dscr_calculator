<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DSCR Calculator</title>
  <meta name="description" content="Simple static calculator for Debt Service Coverage Ratio.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <header>
    <h1>DSCR Calculator</h1>
  </header>

  <div id="adsense-top" style="display:none;"></div>

  <main>
    <form id="dscr-form">
      <label for="grossIncome">Gross Rental/Operating Income</label>
      <input type="number" id="grossIncome" name="grossIncome" step="0.01" required>

      <label for="operatingExpenses">Operating Expenses</label>
      <input type="number" id="operatingExpenses" name="operatingExpenses" step="0.01" required>

      <label for="loanAmount">Loan Amount</label>
      <input type="number" id="loanAmount" name="loanAmount" step="0.01" required>

      <label for="interestRate">Annual Interest Rate (%)</label>
      <input type="number" id="interestRate" name="interestRate" step="0.01" required>

      <label for="termYears">Loan Term (Years)</label>
      <input type="number" id="termYears" name="termYears" step="1" required>

      <label for="paymentFreq">Payment Frequency</label>
      <select id="paymentFreq" name="paymentFreq" required>
        <option value="monthly">Monthly</option>
        <option value="annual">Annual</option>
      </select>

      <button type="submit">Calculate</button>
    </form>

    <section id="result"><p></p></section>
  </main>

  <div id="adsense-bottom" style="display:none;"></div>

  <script src="script.js"></script>
</body>
</html>
